<!doctype html>
<html lang="en" data-theme="dark" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrowthRouter: Find the people asking for what you built</title>
    <meta
      name="description"
      content="You built the fix. People are asking for it right now on Reddit, X, Hacker News, YouTube and Google. Paste your product link: GrowthRouter finds them and writes each one a reply in your voice. You send it."
    />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="color-scheme" content="dark light" />
    <!-- TODO: Set canonical URL to the deployed production domain:
         <link rel="canonical" href="https://YOUR_DOMAIN/" /> -->

    <meta
      property="og:title"
      content="GrowthRouter: Find the people asking for what you built"
    />
    <meta
      property="og:description"
      content="You built the fix. People are asking for it right now on Reddit, X, Hacker News, YouTube and Google. Paste your product link: GrowthRouter finds them and writes each one a reply in your voice. You send it."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="GrowthRouter: Find the people asking for what you built"
    />
    <meta
      name="twitter:description"
      content="You built the fix. People are asking for it right now on Reddit, X, Hacker News, YouTube and Google. Paste your product link: GrowthRouter finds them and writes each one a reply in your voice. You send it."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B0B0C'/%3E%3Crect x='3' y='3' width='18' height='18' rx='4' fill='%23D7FF1E'/%3E%3Cpath d='M7.5 16L12 8L16.5 16M9.75 13.5H14.25' stroke='%230B0B0C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          var saved = localStorage.getItem('growthrouter-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          root.setAttribute('data-theme', theme);
        } catch (e) {
          root.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
